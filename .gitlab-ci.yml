# novabeanscoffee.com — GitLab CI/CD. Pipeline selquor/ci-sablon'dan (laravel.yml); Dockerfile, docker/ ve k8s/ o şablonun
# birebir kopyasıdır (sablon-dagit.sh). Projeye özel olan yalnızca aşağıdaki değişkenlerdir (envanter/k8s-siteler.tsv).
include:
  - {project: selquor/ci-sablon, ref: main, file: laravel.yml}

variables:
  APP: novabeans
  HOST: novabeanscoffee.com
  MOTOR: mysql
  WWW: "1"
  TEST_ZORUNLU: "0"
  TEST_SQLITE: "0"
