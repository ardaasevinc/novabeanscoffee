# novabeanscoffee.com — GitLab CI/CD (k8s-01). Pipeline, Dockerfile ve Kubernetes dosyaları ortak şablondan:
# selquor/ci-sablon (laravel.yml). Projeye özel bir dosya gerekirse aynı adla buraya eklenir.
include:
  - {project: selquor/ci-sablon, ref: main, file: laravel.yml}

variables:
  APP: novabeans
  HOST: novabeanscoffee.com
  TESTHOST: novabeanstest.selquor.com
  MOTOR: mysql
  WWW: "1"
  TEST_ZORUNLU: "0"
