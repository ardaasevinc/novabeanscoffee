; ŞABLON KOPYASI (selquor/ci-sablon@51516b3) — bu dosyayı projede düzenlemeyin; şablon değişince sablon-dagit.sh hepsini günceller.
; php.ini-production üzerine eklenen ayarlar.
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
expose_php = Off

; Kod image'ın içinde değişmez: dosya kontrolüne gerek yok.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; CVE-2026-115560 geçici önlemi (php.net önerisi, 31.10.2026). Yama çıkınca kaldırılabilir.
session.upload_progress.enabled = Off