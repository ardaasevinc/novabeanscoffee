# ŞABLON KOPYASI (selquor/ci-sablon@2473881) — bu dosyayı projede düzenlemeyin; şablon değişince sablon-dagit.sh hepsini günceller.
# Kubernetes tanımları. Pipeline ${...} değerlerini doldurur (envsubst):
#   NAMESPACE  <site> | <site>-test      HOST   canlı adres | <site>test.selquor.com
#   IMAGE      registry.selquor.com/<grup>/<site>:<commit>
# Ayarlar: ConfigMap "ayarlar" (config/*.env) · Secret "gizli" (GitLab PROD_SECRETS / TEST_SECRETS)
# Gizli dosyalar: Secret "dosyalar" (GitLab PROD_DOSYA_* / TEST_DOSYA_*) → /app/storage/gizli/ (salt okunur)
# Diskler (PVC) diskler.yaml'da: bir kez oluşturulur, sonra deploy'lar dokunmaz.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      imagePullSecrets: [{name: registry}]
      securityContext:
        fsGroup: 33
      initContainers:
        # Repodaki dosyalar ilk açılışta kalıcı diske kopyalanır; var olanların üstüne yazılmaz.
        - name: diskler-hazirla
          image: ${IMAGE}
          command: ["sh", "-c", "cp -rn /app/public/uploads/. /uploads/ && cp -rn /app/storage/app/. /storage-app/ && mkdir -p /storage-app/public && echo diskler hazır"]
          volumeMounts:
            - {name: uploads, mountPath: /uploads}
            - {name: storage-app, mountPath: /storage-app}
      containers:
        - name: web
          image: ${IMAGE}
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: ayarlar}
            - secretRef: {name: gizli}
          readinessProbe:
            httpGet: {path: /up, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /up, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: uploads, mountPath: /app/public/uploads}
            - {name: storage-app, mountPath: /app/storage/app}
            - {name: dosyalar, mountPath: /app/storage/gizli, readOnly: true}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
        - name: storage-app
          persistentVolumeClaim: {claimName: storage-app}
        - name: dosyalar
          secret: {secretName: dosyalar, optional: true}
---
# Zamanlanmış işler (routes/console.php) ve kuyruk. Web ile aynı image ve ayarlar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zamanlayici
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: zamanlayici}
  template:
    metadata:
      labels: {app: zamanlayici}
    spec:
      imagePullSecrets: [{name: registry}]
      securityContext:
        fsGroup: 33
      # Kapanışta (deploy, yeniden başlatma) süren işlere 60 sn tanınır: Horizon/queue:work SIGTERM alınca yeni iş almaz, eldekini bitirir.
      terminationGracePeriodSeconds: 60
      containers:
        - name: schedule
          image: ${IMAGE}
          command: ["php", "artisan", "schedule:work"]
          envFrom: &ayarlar
            - configMapRef: {name: ayarlar}
            - secretRef: {name: gizli}
          resources: &kucuk
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 384Mi}
          volumeMounts: &diskler
            - {name: uploads, mountPath: /app/public/uploads}
            - {name: storage-app, mountPath: /app/storage/app}
            - {name: dosyalar, mountPath: /app/storage/gizli, readOnly: true}
        # Kuyruk. Pipeline doldurur (laravel.yml, "kuyruk" adımı):
        #   Horizon kullanan proje (composer.lock'ta laravel/horizon):  php artisan horizon   — süpervizörler/kuyruklar config/horizon.php'den,
        #     canlılık: horizon:status (donarsa konteyner yeniden başlar; "paused" yeniden başlatmaz), bellek 768Mi.
        #   Diğerleri:  php artisan queue:work --tries=3 --max-time=3600  — sadece "default" kuyruğu, bellek 384Mi.
        # Süreç çıkarsa kubelet konteyneri hemen yeniden başlatır (restartPolicy Always); pod düşerse Deployment yenisini açar.
        - name: queue
          image: ${IMAGE}
          command: ["sh", "-c", "exec php artisan ${KUYRUK_KOMUTU}"]
          envFrom: *ayarlar
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: ${KUYRUK_BELLEK}}
          livenessProbe:
            exec: {command: ["sh", "-c", "${KUYRUK_KONTROL}"]}
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts: *diskler
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
        - name: storage-app
          persistentVolumeClaim: {claimName: storage-app}
        - name: dosyalar
          secret: {secretName: dosyalar, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ${NAMESPACE}
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-yonlendir
  namespace: ${NAMESPACE}
spec:
  redirectScheme: {scheme: https, permanent: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-https-yonlendir@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [${HOST}]
      secretName: web-tls
  rules:
    - host: ${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {name: http}}
