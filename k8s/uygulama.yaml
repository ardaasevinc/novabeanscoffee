# Kubernetes tanımları. Pipeline ${...} değerlerini doldurur (envsubst):
#   NAMESPACE  <site> | <site>-test      HOST   canlı adres | <site>test.selquor.com
#   IMAGE      registry.selquor.com/<grup>/<site>:<commit>
# Ayarlar: ConfigMap "ayarlar" (config/*.env) · Secret "gizli" (GitLab PROD_SECRETS / TEST_SECRETS)
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
# Yüklenen dosyalar (public/uploads). Pod'lar yeniden başlasa da kalır.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: ${NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# storage/app: Filament/Livewire yüklemeleri (storage/app/public → /storage) ve uygulamanın yazdığı dosyalar.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-app
  namespace: ${NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      imagePullSecrets: [{name: registry}]
      securityContext:
        fsGroup: 33
      initContainers:
        # Repodaki dosyalar ilk açılışta kalıcı diske kopyalanır; var olanların üstüne yazılmaz.
        - name: diskler-hazirla
          image: ${IMAGE}
          command: ["sh", "-c", "cp -rn /app/public/uploads/. /uploads/ && cp -rn /app/storage/app/. /storage-app/ && mkdir -p /storage-app/public && echo diskler hazır"]
          volumeMounts:
            - {name: uploads, mountPath: /uploads}
            - {name: storage-app, mountPath: /storage-app}
      containers:
        - name: web
          image: ${IMAGE}
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: ayarlar}
            - secretRef: {name: gizli}
          readinessProbe:
            httpGet: {path: /up, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /up, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: uploads, mountPath: /app/public/uploads}
            - {name: storage-app, mountPath: /app/storage/app}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
        - name: storage-app
          persistentVolumeClaim: {claimName: storage-app}
---
# Zamanlanmış işler (routes/console.php) ve kuyruk. Web ile aynı image ve ayarlar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zamanlayici
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: zamanlayici}
  template:
    metadata:
      labels: {app: zamanlayici}
    spec:
      imagePullSecrets: [{name: registry}]
      securityContext:
        fsGroup: 33
      containers:
        - name: schedule
          image: ${IMAGE}
          command: ["php", "artisan", "schedule:work"]
          envFrom: &ayarlar
            - configMapRef: {name: ayarlar}
            - secretRef: {name: gizli}
          resources: &kucuk
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 384Mi}
          volumeMounts: &diskler
            - {name: uploads, mountPath: /app/public/uploads}
            - {name: storage-app, mountPath: /app/storage/app}
        - name: queue
          image: ${IMAGE}
          command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
          envFrom: *ayarlar
          resources: *kucuk
          volumeMounts: *diskler
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
        - name: storage-app
          persistentVolumeClaim: {claimName: storage-app}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ${NAMESPACE}
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-yonlendir
  namespace: ${NAMESPACE}
spec:
  redirectScheme: {scheme: https, permanent: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-https-yonlendir@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [${HOST}]
      secretName: web-tls
  rules:
    - host: ${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {name: http}}
