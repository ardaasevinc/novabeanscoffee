# ŞABLON KOPYASI (selquor/ci-sablon@0e8c80f) — bu dosyayı projede düzenlemeyin; şablon değişince sablon-dagit.sh hepsini günceller.
# www.${HOST} → https://${HOST} kalıcı yönlendirme (sadece canlıda; pipeline WWW=1 ise uygular).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-yonlendir
  namespace: ${NAMESPACE}
spec:
  redirectRegex:
    regex: ^https?://www\.(.+)
    replacement: https://${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-www-yonlendir@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [www.${HOST}]
      secretName: www-tls
  rules:
    - host: www.${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {name: http}}
