# CI/CD — her PR'da kontrol + sır taraması, main'e merge sonrası (ikisi de geçerse) web-01'e deploy ve sürüm etiketi.
# Kaynak: hetzner/scripts/ci/ci.yml (tüm sitelerde aynı; değişiklik oradan PR ile dağıtılır)
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://novabeanscoffee.com
  # Testler bu repoda henüz düzgün değilse "false": sonuç gösterilir ama deploy'u engellemez.
  TESTLER_ZORUNLU: "false"

jobs:
  kontrol:
    name: Kontrol (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - if: hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, pdo_mysql, pdo_pgsql, exif
          coverage: none
          tools: composer:v2

      - name: Composer önbelleği
        if: hashFiles('composer.json') != ''
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Paketler
        if: hashFiles('composer.json') != ''
        # --no-scripts: bazı uygulamalar açılışta veritabanı sorguluyor; CI'da veritabanı yok, açılış test adımında denenir
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Güvenlik açığı taraması (composer audit)
        if: hashFiles('composer.json') != ''
        # Canlıya giden paketler: açık varsa kırmızı, deploy olmaz.
        run: composer audit --locked --no-dev --abandoned=ignore

      - name: Geliştirme paketleri taraması (bilgi amaçlı)
        if: hashFiles('composer.json') != ''
        # Test/geliştirme paketleri (phpunit vb.) sunucuya kurulmaz (--no-dev); açıkları gece güvenlik PR'larıyla kapanır.
        continue-on-error: true
        run: composer audit --locked --abandoned=ignore

      - name: Ortam
        if: hashFiles('composer.json') != ''
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          # Anahtar uygulamayı açmadan üretilir (açılışta veritabanı sorgulayan uygulamalar burada düşmesin)
          sed -i '/^APP_KEY=/d' .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env

      - name: Önyüz derlemesi
        if: hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npm run build --if-present

      - name: Testler
        if: hashFiles('composer.json') != ''
        id: testler
        continue-on-error: ${{ env.TESTLER_ZORUNLU != 'true' }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          php artisan package:discover --ansi
          php artisan test --compact

      - name: Test sonucu (zorunlu değilse uyarı)
        if: steps.testler.outcome == 'failure'
        run: echo "::warning::Testler başarısız ama bu repoda henüz zorunlu değil (TESTLER_ZORUNLU=false)."

  sir-taramasi:
    name: Sır taraması (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks kurulumu
        env:
          SURUM: 8.21.2
          SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${SURUM}/gitleaks_${SURUM}_linux_x64.tar.gz"
          echo "$SHA256  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz && sudo mv gitleaks /usr/local/bin/

      - name: Yeni commit'lerde sır var mı
        # Bu değişiklikle gelen commit'ler taranır; şifre/token/anahtar bulunursa kırmızı olur ve deploy yapılmaz.
        env:
          BAS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BAS" ] || [ "$BAS" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BAS^{commit}" 2>/dev/null; then
            ARALIK="-1"
          else
            ARALIK="$BAS..HEAD"
          fi
          gitleaks git --log-opts="$ARALIK" --redact --no-banner -v

      - name: Deponun tamamı (bilgi amaçlı)
        # Önceden girmiş sırları gösterir; deploy'u engellemez. Bulunan sır geçmişte kalsa bile değiştirilmelidir.
        continue-on-error: true
        run: gitleaks dir . --redact --no-banner -v

  deploy:
    name: Deploy (web-01)
    needs: [kontrol, sir-taramasi]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Forge deploy tetikle
        id: tetik
        env:
          HOOK: ${{ secrets.FORGE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::FORGE_DEPLOY_HOOK tanımlı değil, deploy atlandı."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "tetiklendi=true" >> "$GITHUB_OUTPUT"
          echo "Deploy başlatıldı."

      - name: Site kontrolü
        if: steps.tetik.outputs.tetiklendi == 'true'
        # Cloudflare GitHub sunucularını bot sayıp 403 veriyor; kontrol doğrudan web-01'e (aynı alan adı ve sertifikayla) yapılır.
        env:
          ORIGIN_IP: 2.31.3.154
        run: |
          sleep 90
          HOST=$(echo "$SITE_URL" | sed -E 's#https?://([^/]+).*#\1#')
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' --resolve "$HOST:443:$ORIGIN_IP" "$SITE_URL")
            echo "deneme $i: $SITE_URL → $code"
            case "$code" in 200|301|302) exit 0;; esac
            sleep 15
          done
          echo "::error::Site deploy sonrası yanıt vermiyor ($code)."; exit 1

      - name: Sürüm etiketi
        # Canlıya çıkan her sürüm Releases sayfasında tarih ve değişiklik listesiyle kayda geçer.
        if: steps.tetik.outputs.tetiklendi == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="canli-$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Canlı · $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')" --generate-notes
          echo "Sürüm etiketi: $TAG"
